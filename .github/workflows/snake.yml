name: pixel snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FFB454&color_dots=#ebedf0,#d6cfff,#b7a6ff,#8f7ce0,#5b4bb0
            dist/snake-dark.svg?palette=github-dark&color_snake=#FFB454&color_dots=#1C1838,#3a3070,#5b4bb0,#8f7ce0,#B7A6FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
